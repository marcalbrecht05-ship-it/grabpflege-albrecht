<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Slow fades and short travel; nothing bounces" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.06em}.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-subtle);font-weight:500}.row{display:flex;gap:24px;align-items:baseline}</style></head><body><div style="display:grid;gap:10px;font-size:12px;color:var(--text-muted)"><div style="display:grid;grid-template-columns:110px 70px 1fr;gap:12px;align-items:center"><code style="font-family:ui-monospace,monospace;font-size:11px">--dur-fast</code><span>120ms</span><span>hover/press colour</span></div><div style="display:grid;grid-template-columns:110px 70px 1fr;gap:12px;align-items:center"><code style="font-family:ui-monospace,monospace;font-size:11px">--dur-base</code><span>200ms</span><span>controls, tooltips</span></div><div style="display:grid;grid-template-columns:110px 70px 1fr;gap:12px;align-items:center"><code style="font-family:ui-monospace,monospace;font-size:11px">--dur-slow</code><span>340ms</span><span>panels, dialogs</span></div><div style="display:grid;grid-template-columns:110px 70px 1fr;gap:12px;align-items:center"><code style="font-family:ui-monospace,monospace;font-size:11px">--dur-veil</code><span>600ms</span><span>scroll reveal (fade + 12px rise)</span></div><div class="lbl" style="margin-top:4px">easing: --ease-standard cubic-bezier(.32,.72,.32,1)</div></div></body></html>
