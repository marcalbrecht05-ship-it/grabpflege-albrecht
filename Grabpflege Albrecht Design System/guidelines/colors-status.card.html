<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.06em}.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-subtle);font-weight:500}.row{display:flex;gap:24px;align-items:baseline}</style></head><body><div style="display:flex;gap:10px"><div style="flex:1;background:var(--success-bg);color:var(--success);padding:14px 12px;border-radius:var(--radius-sm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;border:1px solid var(--success)22">Bestätigt</div><div style="flex:1;background:var(--info-bg);color:var(--info);padding:14px 12px;border-radius:var(--radius-sm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;border:1px solid var(--info)22">Hinweis</div><div style="flex:1;background:var(--warning-bg);color:var(--warning);padding:14px 12px;border-radius:var(--radius-sm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;border:1px solid var(--warning)22">Fällig</div><div style="flex:1;background:var(--danger-bg);color:var(--danger);padding:14px 12px;border-radius:var(--radius-sm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;border:1px solid var(--danger)22">Fehler</div></div></body></html>
