<!-- @dsCard group="Colors" viewport="700x210" name="Semantic surfaces & text" subtitle="Aliases every component uses instead of raw ramp values" -->
<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.06em}.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-subtle);font-weight:500}.row{display:flex;gap:24px;align-items:baseline}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;font-size:12px"><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:24px;background:var(--bg-page);box-shadow:inset 0 0 0 1px rgb(35 35 34/.12)"></span><code style="font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)">--bg-page</code></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:24px;background:var(--bg-surface);box-shadow:inset 0 0 0 1px rgb(35 35 34/.12)"></span><code style="font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)">--bg-surface</code></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:24px;background:var(--bg-inset);box-shadow:inset 0 0 0 1px rgb(35 35 34/.12)"></span><code style="font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)">--bg-inset</code></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:24px;background:var(--bg-accent-soft);box-shadow:inset 0 0 0 1px rgb(35 35 34/.12)"></span><code style="font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)">--bg-accent-soft</code></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:24px;background:var(--bg-accent);box-shadow:inset 0 0 0 1px rgb(35 35 34/.12)"></span><code style="font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)">--bg-accent</code></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:24px;background:var(--bg-inverse);box-shadow:inset 0 0 0 1px rgb(35 35 34/.12)"></span><code style="font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)">--bg-inverse</code></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:24px;background:var(--border-hairline);box-shadow:inset 0 0 0 1px rgb(35 35 34/.12)"></span><code style="font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)">--border-hairline</code></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:24px;background:var(--border-subtle);box-shadow:inset 0 0 0 1px rgb(35 35 34/.12)"></span><code style="font-family:ui-monospace,monospace;font-size:11px;color:var(--text-muted)">--border-subtle</code></div></div></body></html>
