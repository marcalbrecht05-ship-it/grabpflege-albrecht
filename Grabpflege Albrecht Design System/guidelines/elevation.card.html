<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--bg-surface);padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;letter-spacing:.06em}.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-subtle);font-weight:500}.row{display:flex;gap:24px;align-items:baseline}</style></head><body><div style="display:flex;gap:22px;padding:8px"><div style="text-align:center"><div style="width:96px;height:72px;background:var(--bg-surface);box-shadow:var(--shadow-xs);border-radius:var(--radius-md)"></div><div class="lbl" style="margin-top:10px">xs</div></div><div style="text-align:center"><div style="width:96px;height:72px;background:var(--bg-surface);box-shadow:var(--shadow-sm);border-radius:var(--radius-md)"></div><div class="lbl" style="margin-top:10px">sm</div></div><div style="text-align:center"><div style="width:96px;height:72px;background:var(--bg-surface);box-shadow:var(--shadow-md);border-radius:var(--radius-md)"></div><div class="lbl" style="margin-top:10px">md</div></div><div style="text-align:center"><div style="width:96px;height:72px;background:var(--bg-surface);box-shadow:var(--shadow-lg);border-radius:var(--radius-md)"></div><div class="lbl" style="margin-top:10px">lg</div></div><div style="text-align:center"><div style="width:96px;height:72px;background:var(--bg-surface);box-shadow:var(--shadow-inset-hairline);border-radius:var(--radius-md)"></div><div class="lbl" style="margin-top:10px">hairline</div></div></div></body></html>
