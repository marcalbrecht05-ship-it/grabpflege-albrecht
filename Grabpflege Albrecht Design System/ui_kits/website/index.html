<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Grabpflege Albrecht</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
<style>body{background:var(--bg-page)}image-slot{--is-bg:var(--stein-200)}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="./Chrome.jsx"></script>
<script type="text/babel" src="./HomeScreen.jsx"></script>
<script type="text/babel" src="./ServicesScreen.jsx"></script>
<script type="text/babel" src="./ProcessScreen.jsx"></script>
<script type="text/babel" src="./ContactScreen.jsx"></script>
<script type="text/babel" data-presets="react">
function App() {
  const [route, setRoute] = React.useState("home");
  const go = (r) => { setRoute(r); window.scrollTo({ top: 0, behavior: "smooth" }); };
  return (
    <div>
      <Header route={route} go={go} />
      {route === "home" ? <HomeScreen go={go} /> : null}
      {route === "leistungen" ? <ServicesScreen go={go} /> : null}
      {route === "ablauf" ? <ProcessScreen go={go} /> : null}
      {route === "kontakt" ? <ContactScreen go={go} /> : null}
      <Footer go={go} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
